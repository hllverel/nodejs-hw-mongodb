tags:
  - Auth
summary: Get Google OAuth URL
operationId: getGoogleOAuthUrl
description: 'Generate and return a Google OAuth authorization URL for user login'
security: []
responses:
  '200':
    description: Successfully generated Google OAuth URL
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully get Google OAuth url!
            data:
              type: object
              properties:
                url:
                  type: string
                  example: 'https://accounts.google.com/o/oauth2/v2/auth?...'
